name: Android compile verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [foundation/architecture]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Kotlin sources (no APK packaging)
        run: gradle :app:compileDebugKotlin
