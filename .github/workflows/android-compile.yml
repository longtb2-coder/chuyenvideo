name: Android APK build verification
on:
  push:
    branches: [ "foundation/architecture", "feature/independent-text-blur", "feature/temporal-text-restoration" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Checkout pinned SEA-G2P source
        uses: actions/checkout@v4
        with:
          repository: pnnbao97/sea-g2p
          ref: v0.10.0
          path: sea-g2p
      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK for SEA-G2P
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Build SEA-G2P Android ARM64 library
        working-directory: sea-g2p
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android24-clang"
          cargo build --locked --release --target aarch64-linux-android --no-default-features --features capi
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libsea_g2p_rs.so ../app/src/main/jniLibs/arm64-v8a/
          cp include/sea_g2p.h ../app/src/main/sea_g2p.h
          test -s ../app/src/main/jniLibs/arm64-v8a/libsea_g2p_rs.so
      - name: Build and test
        run: gradle testDebugUnitTest assembleDebug
      - name: Verify packaged native libraries
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libsea_g2p_jni.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libsea_g2p_rs.so'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: longkaka-seller-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
